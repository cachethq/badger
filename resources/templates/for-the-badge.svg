<svg xmlns="http://www.w3.org/2000/svg" width="{{ totalWidth }}" height="28">
    <g>
        <rect width="{{ vendorWidth }}" height="28" fill="{{ vendorColor }}"/>
        <rect x="{{ vendorWidth }}" width="{{ valueWidth }}" height="28" fill="{{ valueColor }}"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11" letter-spacing="1">
        <text x="{{ vendorStartPosition }}" y="19" fill="#010101" fill-opacity=".3">{{ vendor }}</text>
        <text x="{{ vendorStartPosition }}" y="18">{{ vendor }}</text>
        <text x="{{ valueStartPosition }}" y="19" font-weight="bold" fill="#010101" fill-opacity=".3">{{ value }}</text>
        <text x="{{ valueStartPosition }}" y="18" font-weight="bold">{{ value }}</text>
    </g>
</svg>
